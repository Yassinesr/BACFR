# Phase 1.1 — Resolution test (256 -> 352). Everything else matches the
# current PolypPVT_BACFR.yaml baseline that scored 0.854 mean Dice.
# Expected: if Δmean >= +0.010 vs baseline, resolution is dominant.

Model:
  name: PolypPVT_BACFR
  channels: 32
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  use_flip_consistency: true
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]          # <-- changed from [256, 256]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 4                  # <-- halved; 352^2 + FCT-triple needs headroom
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 1.0e-05
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: True          # <-- enabled to fit batch=4 at 352^2

  Scheduler:
    type: 'PolyLr'
    epoch: 10
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P1_1_res352'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]          # <-- match train
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P1_1_res352'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P1_1_res352'
