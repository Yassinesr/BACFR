# UACANet + Flip-Consistency Training (FCT) on the Polyp-PVT patch dataset.
# Same recipe as configs/UACANet_polyppvt_patch.yaml (UACANet-S: channels 32,
# output_stride 32, 352 resize, full augs, 240 epochs, lr 1e-4) EXCEPT:
#   - Model.name -> UACANet_FCT (+ FCT hyperparameters)
#   - batch_size reduced 32 -> 10 because FCT triples each batch internally
#     (fct_use_vflip=True: orig + H + V), keeping per-iter compute ~constant.
#
# Test-time TTA is 4-view flip averaging via run/Test_patch_tta.py (unchanged);
# for the no-TTA number use run/Test_patches.py.
#
# Train: CUDA_VISIBLE_DEVICES=0 python run/Train.py --config configs/UACANet_polyppvt_patch_fct.yaml --verbose
# Test (TTA):    python run/Test_patch_tta.py --config configs/UACANet_polyppvt_patch_fct.yaml --pth snapshots/UACANet_polyppvt_patch_fct/latest.pth --dt_path /home/yassine/projects/Polyp-PVT/result_map/PolypPVT
# Test (no-TTA): python run/Test_patches.py   --config configs/UACANet_polyppvt_patch_fct.yaml --pth snapshots/UACANet_polyppvt_patch_fct/latest.pth --dt_path /home/yassine/projects/Polyp-PVT/result_map/PolypPVT

Model:
    name: "UACANet_FCT"
    channels: 32
    output_stride: 32
    pretrained: True
    # FCT hyperparameters
    use_flip_consistency: True
    fct_weight: 0.05
    fct_warmup_iters: 300
    fct_use_vflip: True

Train:
    Dataset:
        type: "PolypDataset"
        root: "dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/"
        img_subdir: "img_dir/train"
        mask_subdir: "ann_dir/train"
        transform_list:
            resize:
                size: [352, 352]
            random_scale_crop:
                range: [0.75, 1.25]
            random_flip:
                lr: True
                ud: True
            random_rotate:
                range: [0, 359]
            random_image_enhance:
                methods: ['contrast', 'sharpness', 'brightness']
            random_dilation_erosion:
                kernel_range: [2, 5]
            tonumpy: NULL
            normalize:
                mean: [0.485, 0.456, 0.406]
                std: [0.229, 0.224, 0.225]
            totensor: NULL
    Dataloader:
        batch_size: 8
        shuffle: True
        num_workers: 8
        pin_memory: False
    Optimizer:
        type: "Adam"
        lr: 1.0e-04
        weight_decay: 0.0
        clip: 0.5
        mixed_precision: False
    Scheduler:
        type: "PolyLr"
        epoch: 20
        gamma: 0.9
        minimum_lr: 1.0e-07
        warmup_iteration: 300
    Checkpoint:
        checkpoint_epoch: 1
        checkpoint_dir: "snapshots/UACANet_polyppvt_patch_fct"

Test:
    Dataset:
        type: "PolypDataset"
        root: "/home/yassine/projects/BPR/dataset/TestDataset"
        img_subdir: "images"
        dt_path: "/home/yassine/projects/Polyp-PVT/result_map/PolypPVT"
        datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
        transform_list:
            tonumpy: NULL
            normalize:
                mean: [0.485, 0.456, 0.406]
                std: [0.229, 0.224, 0.225]
            totensor: NULL
    Dataloader:
        num_workers: 8
        pin_memory: True
    Checkpoint:
        checkpoint_dir: "snapshots/UACANet_polyppvt_patch_fct"
