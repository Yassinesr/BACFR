Model:
  name: 'BACFR_Enhanced_v3'
  channels: 256
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 16
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 5.0e-06
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: False

  Scheduler:
    type: 'PolyLr'
    epoch: 10
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3'
