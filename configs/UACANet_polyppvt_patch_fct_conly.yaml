# UACANet + Flip-Consistency Training, CONSISTENCY-ONLY variant.
# Same as configs/UACANet_polyppvt_patch_fct.yaml but fct_supervise_flips=False:
# the main deep-supervised loss is computed on the ORIGINAL view only (identical
# augmentation to vanilla UACANet), and the H/V flips are used solely for the
# consistency MSE. Goal: keep FCT's flip-consistency benefit (which TTA needs)
# WITHOUT the extra flip-augmentation that regresses CVC-300.
#
# Train: CUDA_VISIBLE_DEVICES=0 python run/Train.py --config configs/UACANet_polyppvt_patch_fct_conly.yaml --verbose
# Test (TTA):    python run/Test_patch_tta.py --config configs/UACANet_polyppvt_patch_fct_conly.yaml --pth snapshots/UACANet_polyppvt_patch_fct_conly/latest.pth --dt_path /home/yassine/projects/Polyp-PVT/result_map/PolypPVT
# Test (no-TTA): python run/Test_patches.py   --config configs/UACANet_polyppvt_patch_fct_conly.yaml --pth snapshots/UACANet_polyppvt_patch_fct_conly/latest.pth --dt_path /home/yassine/projects/Polyp-PVT/result_map/PolypPVT

Model:
    name: "UACANet_FCT"
    channels: 32
    output_stride: 32
    pretrained: True
    use_flip_consistency: True
    fct_weight: 0.05
    fct_warmup_iters: 300
    fct_use_vflip: True
    fct_supervise_flips: False   # <-- consistency-only

Train:
    Dataset:
        type: "PolypDataset"
        root: "dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/"
        img_subdir: "img_dir/train"
        mask_subdir: "ann_dir/train"
        transform_list:
            resize:
                size: [352, 352]
            random_scale_crop:
                range: [0.75, 1.25]
            random_flip:
                lr: True
                ud: True
            random_rotate:
                range: [0, 359]
            random_image_enhance:
                methods: ['contrast', 'sharpness', 'brightness']
            random_dilation_erosion:
                kernel_range: [2, 5]
            tonumpy: NULL
            normalize:
                mean: [0.485, 0.456, 0.406]
                std: [0.229, 0.224, 0.225]
            totensor: NULL
    Dataloader:
        # Consistency-only does 3 forwards/iter (orig+H+V) instead of a tripled
        # batch; batch 10 keeps peak memory ~= the tripled-FCT run.
        batch_size: 8
        shuffle: True
        num_workers: 8
        pin_memory: False
    Optimizer:
        type: "Adam"
        lr: 1.0e-04
        weight_decay: 0.0
        clip: 0.5
        mixed_precision: False
    Scheduler:
        type: "PolyLr"
        epoch: 25
        gamma: 0.9
        minimum_lr: 1.0e-07
        warmup_iteration: 300
    Checkpoint:
        checkpoint_epoch: 20
        checkpoint_dir: "snapshots/UACANet_polyppvt_patch_fct_conly"

Test:
    Dataset:
        type: "PolypDataset"
        root: "/home/yassine/projects/BPR/dataset/TestDataset"
        img_subdir: "images"
        dt_path: "/home/yassine/projects/Polyp-PVT/result_map/PolypPVT"
        datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
        out_size: 352
        transform_list:
            tonumpy: NULL
            normalize:
                mean: [0.485, 0.456, 0.406]
                std: [0.229, 0.224, 0.225]
            totensor: NULL
    Dataloader:
        num_workers: 8
        pin_memory: True
    Checkpoint:
        checkpoint_dir: "snapshots/UACANet_polyppvt_patch_fct_conly"
