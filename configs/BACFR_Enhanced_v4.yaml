# =============================================================================
# BACFR_Enhanced_v4 — new model version, no patches to existing files
# =============================================================================
#
# Points to BACFR_Enhanced_v4 (a clean new file, v3.3 is untouched).
# Trained on polyppvt-cropped patch dataset, refining Polyp-PVT predictions.
#
# What changed vs the v3.3 config:
#   - Model name: BACFR_Enhanced_v3_3 → BACFR_Enhanced_v4
#   - random_flip REMOVED from transform_list (FCT provides all flip aug)
#   - use_error_focus: true (v3.3 had it false)
#   - epoch: 10 → 25 (schedules inside v4 match)
#   - warmup_iteration: 300 → 500
#   - 4-view FCT matching 4-view TTA (code change inside v4)
#   - Dual-head uncertainty: original view only, broadcast (code change inside v4)
# =============================================================================

Model:
  name: BACFR_Enhanced_v4
  channels: 256
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  use_flip_consistency: true
  use_error_focus: true
  error_focus_weight: 4.0
  flip_consistency_max: 0.3
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~
  Dataloader:
    batch_size: 4
    shuffle: True
    num_workers: 8
    pin_memory: False
  Optimizer:
    type: 'Adam'
    lr: 5.0e-06
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: False
  Scheduler:
    type: 'PolyLr'
    epoch: 25
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 500
  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v4'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~
  Dataloader:
    num_workers: 8
    pin_memory: True
  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v4'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~
  Dataloader:
    num_workers: 8
    pin_memory: True
  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v4'
