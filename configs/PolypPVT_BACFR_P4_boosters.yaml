# Phase 4 — boosters retained, PVT-appropriate adaptation.
#
# Phase-1 showed the BACFR booster bag at original strength/placement is
# net-negative on PVT-v2 (-0.014 vs vanilla). The boosters are core to the
# research story, so this config keeps all of them but adapts their
# mechanics to PVT-v2:
#
#   * HFGate moved to PVT stage 3 (H/16, 320 ch). This is the spatially-
#     analogous feature to BACFR's gating point on Res2Net x4 (also H/16).
#     PVT stage 4 (H/32, 8x8 at 256^2) was too coarse to have meaningful
#     high-frequency content.
#   * Dual-head aux loss peak lambda reduced 0.30 -> 0.15 to compensate
#     for PVT's narrower 32-channel decoder (BACFR has 64).
#   * FCT consistency peak lambda reduced 0.30 -> 0.10 (same reason).
#
# Plus the two recipe fixes from Phase 1:
#   * 352^2 input (P1.1 showed +0.005)
#   * Train on pranet-traindataset (matches the PraNet test coarse masks
#     used at evaluation; addresses the train/test source mismatch)
#
# Optimizer stays Adam @ 1e-5 + PolyLr 10 epochs (P1.2 ruled out AdamW).

Model:
  name: PolypPVT_BACFR
  channels: 32
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  use_flip_consistency: true
  edge_dist_mode: cdist
  hf_gate_stage: x3              # NEW: move HFGate to PVT stage 3 (H/16, 320 ch)
  aux_lambda_peak: 0.15          # NEW: half of BACFR's 0.30
  flip_consistency_max: 0.10     # one-third of BACFR's 0.30

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'   # matches test coarse masks
    transform_list:
      resize:
        size: [352, 352]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 4                # 352^2 + FCT-triple = 12 effective; comfortable with AMP
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 1.0e-05
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: True

  Scheduler:
    type: 'PolyLr'
    epoch: 10
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P4_boosters'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P4_boosters'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P4_boosters'
