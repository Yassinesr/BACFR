# Phase 2 — Primary recipe. Apply this once P1.1 confirms 352^2 is dominant.
# Differs from P1.4 by turning OFF HFGate (no high-frequency content to gate
# at the 11x11 stage-4 feature). Try batch=8 first; fall back to batch=4 +
# gradient accumulation 2 if OOM at 352^2 + FCT-triple + mixed precision.

Model:
  name: PolypPVT_BACFR
  channels: 32
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: false                # <-- OFF (no HF content at 11x11)
  use_flip_consistency: true
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 8                   # drop to 4 if OOM (effective batch 24 w/ FCT-triple)
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'AdamW'
    lr: 1.0e-04
    weight_decay: 1.0e-04
    clip: 0.5
    mixed_precision: True

  Scheduler:
    type: 'CosineLr'
    epoch: 20
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 1000

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P2'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P2'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P2'
