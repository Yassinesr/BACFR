# BACFR_Enhanced_v3_3 trained on the UNION of pranet-traindataset and
# polyppvt-traindataset patches. Same model, same hyperparameters as the
# single-recipe configs. Only Train/Eval Dataset.root differs (now a list
# of two paths -- PatchDataset handles this natively).
#
# Hypothesis: training on patches from both base segmenters' error
# distributions produces a refiner that handles both PraNet's
# coarser/global boundary errors and Polyp-PVT's finer/local ones.
# Expected (post-correction): ~0.86 on PraNet test base, 0.87-0.88 on
# Polyp-PVT test base. If both base segmenters give the same converged
# ~0.87 floor as the single-recipe configs did, the ceiling is
# structural and this run confirms it. If Polyp-PVT lifts to 0.880+,
# mixed training was the key.

Model:
  name: BACFR_Enhanced_v3_3
  channels: 256
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  use_flip_consistency: true
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root:
      - 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'
      - 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 8
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 5.0e-06
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: False

  Scheduler:
    type: 'PolyLr'
    epoch: 10
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3_3_mixed'

Eval:
  Dataset:
    type: 'PatchDataset'
    root:
      - 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'
      - 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3_3_mixed'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3_3_mixed'
