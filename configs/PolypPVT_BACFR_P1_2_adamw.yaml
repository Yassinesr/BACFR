# Phase 1.2 — Optimizer test (Adam/PolyLr -> AdamW/CosineLr). 256^2 unchanged.
# Train_patch.py auto-detects PolypPVT in Model.name and switches to a unified
# LR with WD excluded from norms/biases.
# Expected: if Δmean >= +0.005 vs baseline, optimizer choice matters.

Model:
  name: PolypPVT_BACFR
  channels: 32
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  use_flip_consistency: true
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 8
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'AdamW'                  # <-- changed
    lr: 1.0e-04                    # <-- 10x higher (matches published Polyp-PVT)
    weight_decay: 1.0e-04          # <-- enabled
    clip: 0.5
    mixed_precision: False

  Scheduler:
    type: 'CosineLr'               # <-- new
    epoch: 20                      # <-- doubled
    gamma: 0.9                     # ignored by CosineLr (kept for kwarg-compat)
    minimum_lr: 1.0e-08
    warmup_iteration: 1000         # <-- longer warmup for AdamW @ 1e-4

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P1_2_adamw'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P1_2_adamw'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P1_2_adamw'
