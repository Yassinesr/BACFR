# BACFR_Enhanced_v3_3 + ERROR-FOCUSED TRAINING, on the polyppvt-cropped
# patch dataset. Goal: raise the refiner's correctness on a strong base
# (Polyp-PVT) by upweighting the loss on pixels where the coarse input
# mask disagrees with GT -- the pixels the refiner must actually correct
# rather than copy.
#
# Identical to BACFR_Enhanced_v3_3_polyppvt.yaml except:
#   use_error_focus: true
#   error_focus_weight: 4.0   (error pixels get 5x BCE weight)
#   checkpoint_dir renamed
#
# Baseline to beat (same data, no error focus): 0.8726 mean Dice on the
# Polyp-PVT test base. Because error focus raises the refiner's
# correctness, it should lift BOTH the deployable score AND the oracle
# ceiling -- unlike gating, which only chases a fixed ceiling.

Model:
  name: BACFR_Enhanced_v3_3
  channels: 256
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: true
  use_boundary_contrast: false
  use_hf_gate: true
  use_flip_consistency: true
  use_error_focus: true          # <-- NEW
  error_focus_weight: 4.0        # <-- NEW: tunable; try 9.0 if 4.0 underwhelms
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 8
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 5.0e-06
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: False

  Scheduler:
    type: 'PolyLr'
    epoch: 10
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3_3_polyppvt_errorfocus'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [256, 256]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3_3_polyppvt_errorfocus'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/BACFR_Enhanced_v3_3_polyppvt_errorfocus'
