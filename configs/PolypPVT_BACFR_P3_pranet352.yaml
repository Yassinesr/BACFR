# Phase 3 — train/test coarse-mask source matched.
#
# Phase-1/2 ablations evaluated against PraNet coarse masks (default dt_path)
# while training on polyppvt-traindataset (PolypPVT-cropped patches). That
# mismatch likely cost us most on CVC-300 (where PolypPVT and PraNet diverge
# in error pattern). BACFR doesn't suffer this because it both trains and
# tests on PraNet outputs.
#
# This config swaps the training root to pranet-traindataset/PatchesDataset-
# IOU-fusion, matching BACFR's recipe exactly. Everything else carries
# forward from the P2_vanilla352 config (the diagnostic winner): vanilla
# booster set, Adam/PolyLr, 352^2 resolution, 10 epochs.

Model:
  name: PolypPVT_BACFR
  channels: 32
  output_stride: 16
  pretrained: true
  use_mccpb: false
  use_dual_heads: false
  use_boundary_contrast: false
  use_hf_gate: false
  use_flip_consistency: false
  edge_dist_mode: cdist

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'  # <-- matches BACFR
    transform_list:
      resize:
        size: [352, 352]
      random_flip:
        lr: True
        ud: True
      random_rotate:
        range: [0, 359]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 4
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 1.0e-05
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: True

  Scheduler:
    type: 'PolyLr'
    epoch: 10
    gamma: 0.9
    minimum_lr: 1.0e-08
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P3_pranet352'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/pranet-traindataset/PatchesDataset-IOU-fusion/'  # <-- match train
    transform_list:
      resize:
        size: [352, 352]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P3_pranet352'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/PolypPVT_BACFR_P3_pranet352'
