# ARM B (no-TTA) and ARM C (same checkpoint, scored with TTA).
#
# Orientation augmentation OFF, flip-consistency ON as its REPLACEMENT.
# This is the arm that tests the core hypothesis: can a pointwise equivariance
# penalty substitute for random-flip/rotate augmentation, and does doing so
# finally leave headroom for flip-TTA to exploit?
#
# TWO SETTINGS ARE LOAD-BEARING -- do not "fix" them:
#
#  1. fct_supervise_flips: FALSE.
#     With true, the flipped views receive gt supervision, which IS flip
#     augmentation reintroduced through the back door. The arm would silently
#     collapse into the existing aug-on FCT run and the ablation would be void.
#
#  2. fct_weight: 0.5 (not 0.05).
#     At 0.05 the weighted consistency term measured ~0.0002 -- far too weak to
#     INSTALL an invariance; it can only polish one that augmentation already
#     built. Here consistency is the sole source of orientation invariance, so
#     it needs a real pull. 0.5 is the starting point; see notes at the bottom.
#
# Train:         CUDA_VISIBLE_DEVICES=0 python run/Train_patch.py --config configs/UACANet_refine_polyppvt_noaug_fct.yaml --verbose
# Test (arm B):  python run/Test_patches.py   --config configs/UACANet_refine_polyppvt_noaug_fct.yaml --pth checkpoints/UACANet_refine_polyppvt_noaug_fct/latest.pth --dt_path /home/yassine/projects/Polyp-PVT/result_map/PolypPVT
# Test (arm C):  python run/Test_patch_tta.py --config configs/UACANet_refine_polyppvt_noaug_fct.yaml --pth checkpoints/UACANet_refine_polyppvt_noaug_fct/latest.pth --dt_path /home/yassine/projects/Polyp-PVT/result_map/PolypPVT

Model:
  name: UACANet_Refine_FCT
  channels: 32          # UACANet-S
  output_stride: 32     # UACANet-S
  pretrained: true
  guidance_scale: 3.0   # coarse prob -> logit prior; sigmoid(+/-3)=0.95/0.05
  # --- FCT (flip-consistency training) ---
  use_flip_consistency: true
  fct_weight: 0.5             # raised from 0.05 -- see header note 2
  fct_warmup_iters: 300
  fct_use_vflip: true
  fct_supervise_flips: false  # CRITICAL -- see header note 1

Train:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]
      # >>> random_flip REMOVED  (arms B/C)
      # >>> random_rotate REMOVED (arms B/C)
      random_image_enhance:
        methods: ['contrast', 'sharpness', 'brightness']
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    batch_size: 6
    shuffle: True
    num_workers: 8
    pin_memory: False

  Optimizer:
    type: 'Adam'
    lr: 1.0e-04
    weight_decay: 0.0
    clip: 0.5
    mixed_precision: False

  Scheduler:
    type: 'PolyLr'
    epoch: 20
    gamma: 0.9
    minimum_lr: 1.0e-07
    warmup_iteration: 300

  Checkpoint:
    checkpoint_epoch: 1
    checkpoint_dir: 'checkpoints/UACANet_refine_polyppvt_noaug_fct'

Eval:
  Dataset:
    type: 'PatchDataset'
    root: 'dataset/polyppvt-traindataset/PatchesDataset-IOU-fusion/'
    transform_list:
      resize:
        size: [352, 352]
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/UACANet_refine_polyppvt_noaug_fct'

Test:
  Dataset:
    type: 'PolypDataset'
    root: '/home/yassine/projects/BPR/dataset/TestDataset'
    img_subdir: 'images'
    dt_path: '/home/yassine/projects/Polyp-PVT/result_map/PolypPVT'
    datasets: ['CVC-300', 'CVC-ClinicDB', 'Kvasir', 'CVC-ColonDB', 'ETIS-LaribPolypDB']
    out_size: 352
    transform_list:
      tonumpy: ~
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      totensor: ~

  Dataloader:
    num_workers: 8
    pin_memory: True

  Checkpoint:
    checkpoint_dir: 'checkpoints/UACANet_refine_polyppvt_noaug_fct'
